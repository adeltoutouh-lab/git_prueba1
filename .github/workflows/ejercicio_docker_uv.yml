name: Generar evidencias Docker y UV

on:
  push:
    branches:
      - ejercicio-docker-uv
    paths:
      - 'ejercicio_docker_uv/**'
      - '.github/workflows/ejercicio_docker_uv.yml'

permissions:
  contents: write

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar ejercicio dentro de Docker
        run: |
          cd ejercicio_docker_uv
          docker compose build
          docker compose run --rm app bash generar_evidencias.sh

      - name: Guardar evidencias generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ejercicio_docker_uv
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git commit -m "Añadir evidencias del ejercicio"
          git push
